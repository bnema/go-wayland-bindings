name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install Wayland libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-server0 libwayland-client0 wayland-utils
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - name: Test (CGO disabled)
        run: CGO_ENABLED=0 go test ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
          test -z "$(git status --porcelain)"
