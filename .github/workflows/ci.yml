name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Wayland libraries
        run: sudo apt-get install -y libwayland-server0 libwayland-client0 wayland-utils
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Test (CGO disabled)
        run: CGO_ENABLED=0 go test ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code
          test -z "$(git status --porcelain)"
